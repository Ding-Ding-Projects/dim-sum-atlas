name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - shell: pwsh
        run: |
          $releaseTag = "v0.1.$env:GITHUB_RUN_NUMBER"
          $releaseVersion = $releaseTag.TrimStart('v')
          $releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $catalog = Invoke-RestMethod 'https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json'
          $catalogIndex = ([int]$env:GITHUB_RUN_NUMBER - 1) % [int]$catalog.total
          $dish = @($catalog.dishes)[$catalogIndex]
          if (-not $dish -or -not $dish.image.path) { throw "Public catalog record $catalogIndex has no published image path." }
          $photoName = [IO.Path]::GetFileName($dish.image.path)
          $photoUrl = "https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/download/catalog-v1/$photoName"
          $codeName = "$($dish.name.en) · $($dish.name.zhHant)"
          if ((Invoke-WebRequest -Uri $photoUrl -Method Head -UseBasicParsing).StatusCode -ne 200) { throw "Public photo asset is not published: $photoUrl" }
          $current = [ordered]@{
            version = $releaseVersion
            date = $releaseDate
            commit = $env:GITHUB_SHA
            releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$releaseTag"
            codeName = $codeName
            photoUrl = $photoUrl
            title = 'Material 3 atlas release'
            body = 'Published the public catalog atlas and its verified Windows package.'
          }
          $history = @()
          if (Test-Path src/release-info.json) {
            $existing = Get-Content src/release-info.json -Raw | ConvertFrom-Json
            $history = @($existing.history | Where-Object { $_.version -ne $releaseVersion })
          }
          $history += [pscustomobject]$current
          $releaseInfo = @{
            version = $releaseVersion
            date = $releaseDate
            commit = $env:GITHUB_SHA
            releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$releaseTag"
            codeName = $current.codeName
            photoUrl = $photoUrl
            history = $history
          } | ConvertTo-Json -Depth 5
          Set-Content -Path src/release-info.json -Value $releaseInfo -Encoding utf8
      - run: npm run check
      - run: node scripts/count-lines.mjs | Tee-Object -FilePath line-count.txt
      - run: npm run package:windows
      - shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.1.$env:GITHUB_RUN_NUMBER"
          $zip = "DimSumAtlas-$tag-windows-x64.zip"
          $catalog = Invoke-RestMethod 'https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json'
          $catalogIndex = ([int]$env:GITHUB_RUN_NUMBER - 1) % [int]$catalog.total
          $dish = @($catalog.dishes)[$catalogIndex]
          if (-not $dish -or -not $dish.image.path) { throw "Public catalog record $catalogIndex has no published image path." }
          $photoName = [IO.Path]::GetFileName($dish.image.path)
          $photoUrl = "https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/download/catalog-v1/$photoName"
          $codeName = "$($dish.name.en) · $($dish.name.zhHant)"
          if ((Invoke-WebRequest -Uri $photoUrl -Method Head -UseBasicParsing).StatusCode -ne 200) { throw "Public photo asset is not published: $photoUrl" }
          Compress-Archive -Path "dist/DimSumAtlas-win32-x64/*" -DestinationPath $zip
          $notes = 'Automated Windows portable build for ' + $env:GITHUB_SHA + [Environment]::NewLine + [Environment]::NewLine + '## Dim sum code name' + [Environment]::NewLine + [Environment]::NewLine + $codeName + [Environment]::NewLine + [Environment]::NewLine + '[Public catalog photo](' + $photoUrl + ')' + [Environment]::NewLine + [Environment]::NewLine + '## CI line count' + [Environment]::NewLine + [Environment]::NewLine + (Get-Content line-count.txt -Raw)
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --title "Dim Sum Atlas $tag" --notes $notes --target $env:GITHUB_SHA
