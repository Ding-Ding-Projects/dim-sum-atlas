name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/count-lines.mjs | Tee-Object -FilePath line-count.txt
      - run: npm run package:windows
      - shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.1.$env:GITHUB_RUN_NUMBER"
          $zip = "DimSumAtlas-$tag-windows-x64.zip"
          Compress-Archive -Path "dist/DimSumAtlas-win32-x64/*" -DestinationPath $zip
          $notes = "Automated Windows portable build for $env:GITHUB_SHA.`n`n## CI line count`n`n````text`n$(Get-Content line-count.txt -Raw)````"
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --title "Dim Sum Atlas $tag" --notes $notes --target $env:GITHUB_SHA
